name: Bug 报告
description: 报告可复现的功能、安装或兼容性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿上传真实配置、数据库、QQ/微信标识、消息正文、凭据、日志或未脱敏截图。安全问题请按 SECURITY.md 私密报告。
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 简洁说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与已脱敏错误
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: OS、Hermes Desktop 版本、Workbench Release 或提交号。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除凭据、个人路径、真实平台标识、消息正文和其他敏感数据。
          required: true
