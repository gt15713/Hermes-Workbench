name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # WB-S1-022 第二层一致性保险（非根治）：runner 上 Python I/O 统一 UTF-8，
    # 消除 Ubuntu/Windows locale 漂移；根治在脚本输出边界显式 reconfigure('utf-8')。
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export exact test Python
        shell: python
        run: |
          import os
          import sys

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"WORKBENCH_TEST_PYTHON={sys.executable}\n")

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group dev

      - name: Ruff lint
        run: |
          ruff --version
          python -c "import subprocess; assert subprocess.check_output(['ruff', '--version'], text=True).strip() == 'ruff 0.16.5'"
          ruff check dashboard scripts

      - name: Privacy gate
        run: python scripts/workbench_privacy_gate.py

      - name: Pytest (dashboard)
        run: python -m pytest dashboard -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend deps
        run: cd desktop-src && npm ci

      - name: Vitest
        run: cd desktop-src && npx vitest run

      - name: Layout regression (node:test)
        run: node --test desktop-src/layout-regression.test.mjs

      - name: Typecheck
        run: cd desktop-src && npx tsc --noEmit

      - name: Bundle rebuild check (plugin.js 进仓库一致性)
        run: |
          node build-desktop.mjs
          git diff --exit-code desktop/plugin.js || {
            echo "::error::desktop/plugin.js 与源码不一致——请运行 node build-desktop.mjs 后提交产物";
            exit 1;
          }
